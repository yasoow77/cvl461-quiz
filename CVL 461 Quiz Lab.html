<style>
/* Layout: one centred column (max 760px). Home = lecture cards in the lecture colours of the study PDF, then midterm cards. Quiz = one question per screen. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eaeef5; --fg:#18202f; --muted:#5a6578; --line:#d6dce7;
  --accent:#1d4ed8; --on-accent:#ffffff;
  --good:#0f7a4d; --good-bg:#def5ea; --bad:#b42318; --bad-bg:#fde5e2; --warn:#8a5a00; --warn-bg:#fdf0cf;
  --l1:#2563eb; --l2:#c2650a; --l3:#7c3aed; --l5:#0b8a5f; --l6:#d1322d; --mt:#18202f;
  --display:"Space Grotesk","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141c; --surface:#19202c; --surface2:#232c3b; --fg:#e8ecf3; --muted:#9aa6ba; --line:#2f394a;
  --accent:#7aa2ff; --on-accent:#0c1220;
  --good:#5fd6a0; --good-bg:#12382a; --bad:#ff8f85; --bad-bg:#45191a; --warn:#f2c761; --warn-bg:#3d3013;
  --l1:#6f9bff; --l2:#f0a04b; --l3:#b08cff; --l5:#4fd0a0; --l6:#ff7d76; --mt:#e8ecf3; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#19202c; --surface2:#232c3b; --fg:#e8ecf3; --muted:#9aa6ba; --line:#2f394a;
  --accent:#7aa2ff; --on-accent:#0c1220;
  --good:#5fd6a0; --good-bg:#12382a; --bad:#ff8f85; --bad-bg:#45191a; --warn:#f2c761; --warn-bg:#3d3013;
  --l1:#6f9bff; --l2:#f0a04b; --l3:#b08cff; --l5:#4fd0a0; --l6:#ff7d76; --mt:#e8ecf3; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.9rem;letter-spacing:-.02em} h2{font-size:1.15rem} h3{font-size:1.05rem}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.group{display:flex;flex-direction:column;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{--c:var(--accent);text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--c)}
.card .tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.card .name{font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.25}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);margin-top:auto;padding-top:6px;font-variant-numeric:tabular-nums}
.card .best{font-weight:600;color:var(--fg)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.9rem}
.opt-row label{display:flex;gap:7px;align-items:center;cursor:pointer}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.86rem;color:var(--muted)}
/* quiz */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .title{font-family:var(--display);font-weight:600;min-width:0;flex:1}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .2s}
@media (prefers-reduced-motion: reduce){.prog i{transition:none}}
.count{font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.lec{background:transparent;border:1.5px solid var(--c);color:var(--c)}
.qtext{font-size:1.08rem;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;margin-top:2px;display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1}
.opt.round .box{border-radius:50%}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--surface2)}
.opt[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt:disabled{cursor:default;color:inherit}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt .why{margin-left:auto;font-size:.72rem;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.right .why,.opt.missed .why{color:var(--good)} .opt.wrong .why{color:var(--bad)}
.fb{border-radius:10px;padding:11px 13px;font-size:.93rem}
.fb.ok{background:var(--good-bg);color:var(--good)} .fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block} .fb span{color:var(--fg)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
/* results */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .n{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 90px 52px;gap:10px;align-items:center;font-size:.88rem}
.row .prog{height:6px}.row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.rev{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.rev.ok{border-left-color:var(--good)}
.rev .q{font-weight:600}
.rev .a b{color:var(--good)} .rev .y b{color:var(--bad)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
summary{cursor:pointer;font-weight:600;line-height:1.4}
details .ans{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);white-space:pre-line;font-size:.95rem}
details .hint{font-size:.8rem;color:var(--accent);font-weight:600;margin-top:6px;display:block}
details[open] .hint{display:none}
</style>

<script>
/* ---------- question bank ---------- */
const LEC={
  L1:{n:"Lecture 1",t:"Introduction to Smart Cities",c:"--l1"},
  L2:{n:"Lecture 2",t:"Smart Construction, Infrastructure Management & Monitoring",c:"--l2"},
  L3:{n:"Lecture 3",t:"Smart Urban Infrastructures & Smart Cities",c:"--l3"},
  L5:{n:"Lecture 5",t:"Smart Urban Energy Systems",c:"--l5"},
  L6:{n:"Lecture 6",t:"Smart Urban Transportation Systems",c:"--l6"}
};
// [lecture, source, question, options, correct indexes, explanation]
const RAW=[
/* ===== Lecture 1 (extra practice) ===== */
["L1","Extra","Roughly how many people live in urban areas today?",["1.2 billion (about 20% of the world)","3.9 billion (over 54% of the world)","6.0 billion (about 75% of the world)","7.5 billion (about 90% of the world)"],[1],"Over 3.9 billion people, more than 54% of the world population."],
["L1","Extra","The urban population is expected to reach what figure by 2045?",["4.5 billion","5.0 billion","6.0 billion","9.0 billion"],[2],"The lecture gives 6.0 billion by 2045."],
["L1","Extra","Which statements about cities are correct?",["Cities generate more than 80% of global greenhouse gas emissions","Cities generate 75% of waste","Cities account for 70% of global energy use","Cities account for only 25% of global energy use"],[0,1,2],">80% of GHG emissions, 75% of waste and 70% of energy use."],
["L1","Extra","Under the digital paradigm shift, urban systems must become:",["Sustainable","Inclusive","Reliable","Efficient","Centralized"],[0,1,2,3],"Sustainable, inclusive, reliable and efficient."],
["L1","Extra","Which definition of sustainability matches the lecture?",["Maximizing economic growth in the present generation","Meeting the needs of the present without compromising the ability of future generations to meet their own needs","Replacing all fossil fuels with renewable energy","Reducing the population of cities"],[1],"This is the definition used in the lecture."],
["L1","Extra","What are the three pillars of sustainability?",["Environment","Economy","Society","Technology","Politics"],[0,1,2],"Environment, economy and society, considered together."],
["L1","Extra","Which pillar of sustainability covers quality of life, equity, health, safety and accessibility?",["Environment","Economy","Society"],[2],"The society pillar is about people and community well-being."],
["L1","Extra","How many Sustainable Development Goals (SDGs) did the UN establish?",["7","11","13","17"],[3],"There are 17 SDGs."],
["L1","Extra","Which SDGs are most directly linked to smart cities in the lecture?",["SDG 7 – Affordable and Clean Energy","SDG 9 – Industry, Innovation and Infrastructure","SDG 11 – Sustainable Cities and Communities","SDG 13 – Climate Action","SDG 14 – Life Below Water"],[0,1,2,3],"SDGs 7, 9, 11 and 13."],
["L1","Extra","What is SDG 11?",["Climate Action","Sustainable Cities and Communities","Affordable and Clean Energy","Industry, Innovation and Infrastructure"],[1],"SDG 11 is Sustainable Cities and Communities."],
["L1","Extra","Urbanization increases the demand for which of the following?",["Energy","Mobility","Water","Urban services","Agricultural land inside cities"],[0,1,2,3],"The lecture lists energy, mobility, water and urban services."],
["L1","Extra","Which pillar of sustainability includes efficient resource use, innovation and employment?",["Environment","Economy","Society"],[1],"Economic viability, efficient resource use, innovation and employment belong to the economy pillar."],

/* ===== Lecture 2 – Sheet 1 ===== */
["L2","Sheet 1","What is the definition of Smart Construction?",["Using digital tools only after project completion.","The use of sensors, data, and digital tools throughout the construction lifecycle.","Relying exclusively on manual inspections and paper drawings.","Replacing human labor with fully autonomous site robotics only."],[1],"Smart construction covers the whole lifecycle, not just the finished project."],
["L2","Sheet 1","In smart construction equipment, how is a \"Smart Product\" defined?",["The remote support and maintenance alerts layer provided by equipment dealers.","The cloud integration connecting multiple machines across the site.","The physical machine itself embedded with smart technology like sensors, GPS, and semi-autonomous features.","The central dashboard used by project managers."],[2],"Smart Product = the machine. Option 1 describes Smart Service, option 2 Smart Solution."],
["L2","Sheet 1","Which smart construction layer provides site-wide data integration from sources like drones and cloud connectivity for site optimization?",["Smart Product","Smart Service","Smart Solution","Smart Component"],[2],"Smart Solution is the site-wide systems level."],
["L2","Sheet 1","How does a BIM model differ fundamentally from a traditional 2D CAD drawing?",["BIM consists only of flat lines, dimensions, and hatching.","BIM is an information-rich, 3D intelligent model combining geometry with coordinated data across disciplines.","CAD models automatically update across all disciplines when changes occur.","CAD contains asset lifecycle and maintenance schedule data."],[1],"BIM = geometry + data. Flat lines and hatching describe CAD."],
["L2","Sheet 1","Which BIM dimension links the 3D geometry model to the construction schedule for time simulation?",["3D","4D","5D","6D"],[1],"4D = time / schedule."],
["L2","Sheet 1","What does 5D BIM add on top of the 4D schedule model?",["Facility management and maintenance schedules","Energy consumption and environmental sustainability analysis","Real-time budget and cost data tracking","Spatial geometry and clash detection"],[2],"5D = cost."],
["L2","Sheet 1","Which BIM dimensions represent Sustainability/Energy performance and Facility Management, respectively?",["4D and 5D","5D and 6D","6D and 7D","3D and 7D"],[2],"6D = sustainability/energy, 7D = facility management."],
["L2","Sheet 1","In Europe's Crossrail project, how were 4D and 5D BIM utilized?",["To monitor worker heart rates on-site.","To manage scheduling, MEP installation progress, and costs at a massive infrastructure scale.","To replace physical tunnel excavation with virtual models.","To perform real-time structural health monitoring on sea bridges."],[1],"Crossrail used 4D/5D BIM for scheduling and cost."],
["L2","Sheet 1","Which Computer Vision model scans images in real time to detect and locate defects such as cracks with 96%+ accuracy?",["AutoCAD","eQUEST","YOLO (\"You Only Look Once\")","Revit"],[2],"YOLO scans an image once to detect and locate objects."],
["L2","Sheet 1","What is a key benefit of AI-powered image analysis for defect detection during construction?",["It replaces the need for structural engineers during design.","It catches defects and cracks early before costly rework occurs after concrete cures or structures are enclosed.","It eliminates the need for 3D BIM models.","It lowers the energy consumption of heavy machinery."],[1],"Early detection avoids costly rework."],
["L2","Sheet 1","What technology does Doxel use to track progress and compare the site against BIM models?",["Smart helmets and wearable RTLS tags","AI-equipped drones and rovers daily scanning the site","Fiber-optic sensors embedded inside concrete","Fiber-optic piezometers and tiltmeters"],[1],"Doxel uses AI-equipped drones and rovers."],
["L2","Sheet 1","What is Structural Health Monitoring (SHM)?",["Periodic manual inspection of building facades using physical ladders.","Continuous sensor-based tracking of structural strain, vibration, and displacement to identify instability or degradation.","Measuring daily attendance and productivity of site workers.","Simulating building energy performance prior to construction."],[1],"SHM is continuous and sensor-based."],
["L2","Sheet 1","When does Structural Health Monitoring typically begin?",["Only after a structural failure or major crack appears.","During construction when sensors are embedded, continuing as handover into the infrastructure management phase.","Exclusively during the 2D CAD design phase.","After 50 years of asset operational life."],[1],"Sensors are embedded during construction, so monitoring starts at opening."],
["L2","Sheet 1","In the Hong Kong–Zhuhai–Macau Bridge case, what sensor network monitors strain, ship-impact risk and seismic response?",["A network of over 1,500 fiber-optic and accelerometer sensors.","Doxel daily rover scanning.","Wearable smart vests and WakeCap helmets.","2D AutoCAD floor plan tracking."],[0],"Over 1,500 fiber-optic and accelerometer sensors for a 120-year service life."],
["L2","Sheet 1","Which safety technology tracks worker location, attendance and ambient conditions in real time (Opera Grand Tower case)?",["Wearables (e.g., WakeCap smart helmets & vests)","Pneumatic waste pipes","6D BIM models","Ultrasonic concrete testing"],[0],"WakeCap wearables were used at Opera Grand Tower, Dubai."],
["L2","Sheet 1","What is the role of Centralized Safety Dashboards on a construction site?",["To generate automatic 2D CAD floor plans.","To aggregate live data from wearables, drones, and site sensors into a single view for site managers.","To eliminate project schedules and budget estimates.","To calculate 6D energy consumption metrics."],[1],"One live view of all safety data."],
["L2","Sheet 1","How does Smart Construction transition into long-term infrastructure monitoring at the \"Handover Moment\"?",["Smart technologies are completely removed once construction ends.","Embedded structural sensors continue tracking physical assets into their operational life, shifting defect detection into predictive maintenance.","Safety monitoring stops entirely as public usage begins.","Construction contractors permanently manage public municipal transit."],[1],"Monitoring begins when construction ends."],
["L2","Sheet 1","Mega-projects in Egypt such as the New Administrative Capital and New Alamein demonstrate a shift toward:",["Abandoning BIM in favor of hand-drawn paper blueprints.","Rapid BIM adoption and embedding digital infrastructure into projects from day one.","Postponing smart monitoring until 20 years after building completion.","Relying solely on traditional, non-connected construction practices."],[1],"Rapid BIM adoption and smart monitoring built in from day one."],
["L2","Sheet 1","Which safety technology gives supervisors real-time location tracking and proximity alerts near hazards?",["5D BIM Software","Wearable RTLS tags and Smart Helmets","Piezometer sensors","Ultrasonic crack detectors"],[1],"Real-time location systems (RTLS) and geofencing."],
["L2","Extra","What results did Doxel report on its projects?",["38% productivity increase and 11% under budget","11% productivity increase and 38% under budget","96% productivity increase","A 120-year service life"],[0],"38% productivity increase and 11% under budget."],
["L2","Extra","Which facts about London Crossrail (Elizabeth Line) are correct?",["It is a 118 km railway","It includes 42 km of new tunnels","It was built between 2009 and 2022","It is a 55 km sea crossing"],[0,1,2],"The 55 km sea crossing is the Hong Kong–Zhuhai–Macau Bridge."],
["L2","Extra","A dealer's system warns a site manager two weeks before a hydraulic pump fails. Which layer is this?",["Smart Product","Smart Service","Smart Solution"],[1],"Predictive maintenance alerts are part of Smart Service."],
["L2","Extra","Which physical quantities does SHM detect, according to its definition?",["Strain","Vibration","Displacement","Worker attendance"],[0,1,2],"Strain, vibration and displacement."],

/* ===== Lecture 3 – Sheet 2 ===== */
["L3","Sheet 2","Cities can be studied from different perspectives, and as different types of systems, which can be...",["Economic systems","Technical systems","Demographic systems","Political systems","Social systems"],[0,1,3,4],"The four views are technological, economic, political and social."],
["L3","Sheet 2","What are the main layers used to conceptualize urban systems?",["Infrastructure layer","Economic layer","Service layer","Green layer","Institutional layer"],[0,2],"Traditionally two layers: infrastructure and services."],
["L3","Sheet 2","What are the three key metrics used to characterize the performance of urban infrastructure systems?",["Quality of life","Efficiency","Resilience","Sustainability","Growth","Investments"],[1,2,3],"Efficiency, resilience and sustainability."],
["L3","Sheet 2","How does the conceptualization of smart cities differ from the traditional conceptualization of urban systems?",["By the use of electric vehicles","By the addition of a data layer","Through the merging of the infrastructure and service layers","By the addition of a citizen layer"],[1],"A digital/data layer is added between infrastructure and services."],
["L3","Sheet 2","Which of the following components enable the development of the data layer for Smart Cities?",["The internet","Telecommunications infrastructure","The World Wide Web","Social networks"],[0,1,2],"Telecom infrastructure, networks (the Internet) and identification/exchange of data (the WWW)."],
["L3","Sheet 2","Which definition best describes digitalization?",["The process of using the outputs of a component of a system to influence the inputs of the same component.","The interconnection of computers and other digital devices through the internet.","The integration of Information and Communication Technologies (ICTs) into most aspects of everyday life through the use of new and legacy telecommunication infrastructures and networks."],[2],"Option 1 describes a feedback loop."],
["L3","Sheet 2","Which option best describes how digitalization is being used to improve value chains?",["Value chains can be closely monitored by customers and managers by being mirrored in the digital layer.","Value chains can be eliminated through the substitution of human labor with digital technologies.","Value chains can become more efficient by reducing the number of services offered in the physical layer."],[0],"The physical value chain is mirrored in the digital layer and optimized."],
["L3","Sheet 2","Which of the following options are NOT examples of digitalization?",["Smart energy meters","Smart lighting","Traffic surveillance systems","Electric vehicles","Wind turbines"],[3,4],"EVs and wind turbines are energy technologies, not ICT integration."],
["L3","Sheet 2","What are the two main visions for implementing a Smart City?",["Users as leaders: citizens lead and govern the transition using digital tools.","Users as citizens: the public sector leads the transition, and the city is built to serve the citizens.","Users as consumers: vendors lead the transition, and the smart city is built to increase profits."],[1,2],"City perspective (citizens) versus vendor perspective (consumers)."],
["L3","Sheet 2","A Socio-Technical system can be defined as:",["A system in which people and technology, including infrastructures, interact in a reciprocal relationship within an environment.","A system in which individuals only interact with each other and have no impact on technological components.","A system in which individuals and technology interact with one another but does not have boundaries nor relation to its environment."],[0],"Mutual influence between infrastructure and human systems."],
["L3","Sheet 2","Which smart city vision relies on a technology-push approach?",["The Vendor Vision","The Non-Governmental Organization Vision","The City Government Vision","The Citizen Vision"],[0],"Vendors push technology; cities follow demand-pull."],
["L3","Sheet 2","True or false: value chain information mirrored in the data layer can be used to improve the layer or create new services and business models, allowing companies to find new ways to profit.",["True","False"],[0],"This is the 'new business models' benefit of digitalization."],
["L3","Sheet 2","Smart cities can be seen from a...",["Political perspective","Technological perspective","Social perspective","Economic perspective"],[0,1,2,3],"All four perspectives apply."],
["L3","Sheet 2","How does digitalization affect non-scalable industries, such as the taxi industry?",["It turns consumers into prosumers","It allows them to start scaling up","It allows them to develop new business models on which to capitalize"],[1],"Platforms like e-hailing let a local, non-scalable service scale. This one is not stated word for word in the slides, so confirm it with your instructor."],
["L3","Sheet 2","Which statement is more accurate about the impact of digitalization on the management of cities as socio-technical systems?",["It enables cities to cope with the high complexity and interdependency that characterize urban systems.","It enables urban dwellers and citizens to connect with one another and develop social activities.","It allows public authorities to closely monitor and control the activity of all citizens."],[0],"Digitalization helps manage complexity and interdependency."],
["L3","Sheet 2","Which statement correctly reflects the implications of complex feedback loops in urban systems?",["They make urban management easier by reducing uncertainty in city operations.","They enable cities to remain static and predictable in response to changes.","They contribute to cities being highly dynamic and path-dependent, complicating management and governance.","They isolate technical systems from social and economic interactions, simplifying planning."],[2],"Cities are unpredictable and path-dependent, so they need holistic, adaptive strategies."],
["L3","Sheet 2","Which statement best captures one of the key tensions in Smart City development?",["Vendors prioritize citizen needs above commercial interests.","Cities view people primarily as consumers to sell services to.","The leadership in Smart Cities is often a balance between commercial vendors and citizen-focused governance.","Tech-push strategies are always aligned with citizen priorities."],[2],"The leadership tension: vendors or cities?"],
["L3","Sheet 2","Which role is typically associated with infrastructure companies in smart city development?",["Providing data analytics and dashboards","Supplying smart devices and sensors","Operating in urban sectors and integrating data services","Managing social media platforms"],[2],"Infrastructure companies (e.g., Siemens, Schneider Electric) operate urban sectors and add data layers."],
["L3","Midterm 2025","What are the five dimensions that must be considered when transitioning to smart cities?",["Political","Technological","International","Economic","Social","Environmental"],[0,1,3,4,5],"Official answer: political, technological, economic, social and environmental."],
["L3","Midterm 2025","Which option best describes the main consequence of digitalization?",["The rapid decrease of the number of connected devices","Rapid development in the capacity to analyze and visualize data","An increase in household bandwidth"],[1],"Official answer: rapid development in the capacity to analyze and visualize data."],
["L3","Midterm 2025","Which of the following are examples of urban subsystems in which a smart city transition could also be implemented?",["Housing","Green infrastructures","Topography","Eco-Tourism","Water and waste"],[0,1,4],"Official answer: housing, green infrastructures, water and waste."],
["L3","Midterm 2025","What are examples of technologies used to analyze \"Big Data\"?",["Machine learning","Smart phones","Internet of Things","Artificial intelligence"],[0,3],"Machine learning and AI analyze data; phones and IoT generate it."],
["L3","Midterm 2025","Which of the following are examples of data generating devices?",["Sensors","GPS","Smart phones","Servers","Cameras"],[0,1,2,4],"Servers store data; they don't generate it."],

/* ---------- quiz ---------- */
function start(cfg){
  const qs=(cfg.fixed||!prefs.shuffle)?cfg.qs.slice():shuffle(cfg.qs);
  S={...cfg,qs,i:0,ans:qs.map(()=>[]),checked:qs.map(()=>false),t0:Date.now()};
  render();
}
function render(){
  clearInterval(timer);app.textContent="";
  const q=S.qs[S.i],L=LEC[q.lec],n=S.qs.length;
  const bar=$("div","bar");const back=$("button","link","← Home");back.type="button";back.onclick=home;
  const cnt=$("span","count");bar.append(back,$("span","title",S.title),cnt);app.append(bar);
  const tick=()=>{const s=Math.floor((Date.now()-S.t0)/1000);cnt.textContent=(S.i+1)+" / "+n+(S.exam?"  ·  "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"):"")};
  tick();if(S.exam)timer=setInterval(tick,1000);
  const pr=$("div","prog");pr.style.setProperty("--c",S.color);const pi=$("i");pi.style.width=((S.i+(S.checked[S.i]?1:0))/n*100)+"%";pr.append(pi);app.append(pr);

  const multi=S.exam||q.a.length>1, done=S.checked[S.i];
  const qc=$("div","qcard");const meta=$("div","qmeta");
  const lp=$("span","pill lec",L.n);lp.style.setProperty("--c","var("+L.c+")");meta.append(lp,$("span","pill",q.src));
  if(!S.exam)meta.append($("span","pill",q.a.length>1?"Select all that apply":"One answer"));
  qc.append(meta,$("div","qtext",q.q));
  const opts=$("div","opts");opts.setAttribute("role",multi?"group":"radiogroup");
  q.o.forEach((t,j)=>{
    const b=$("button","opt"+(multi?"":" round"));b.type="button";b.setAttribute("role",multi?"checkbox":"radio");
    const sel=S.ans[S.i].includes(j);b.setAttribute("aria-checked",sel);
    const box=$("span","box",sel?"✓":"");b.append(box,$("span","",letters[j]+")  "+t));
    if(done){b.disabled=true;const ok=q.a.includes(j);
      if(sel&&ok){b.classList.add("right");b.append($("span","why","Correct"))}
      else if(sel&&!ok){b.classList.add("wrong");box.textContent="✕";b.append($("span","why","Wrong"))}
      else if(ok){b.classList.add("missed");b.append($("span","why","Correct answer"))}
    }else b.onclick=()=>{let a=S.ans[S.i];
      if(multi)a=a.includes(j)?a.filter(x=>x!==j):a.concat(j);else a=[j];
      S.ans[S.i]=a;render()};
    opts.append(b)});
  qc.append(opts);
  if(done){const ok=same(S.ans[S.i],q.a);const fb=$("div","fb "+(ok?"ok":"no"));fb.append($("b","",ok?"Correct":"Not quite"),$("span","",q.e||""));qc.append(fb)}
  const acts=$("div","acts");
  const last=S.i===n-1;
  if(S.exam){
    const pv=$("button","btn","Previous");pv.type="button";pv.disabled=S.i===0;pv.onclick=()=>{S.i--;render()};
    const nx=$("button","btn pri",last?"Finish exam":"Next");nx.type="button";nx.onclick=()=>{if(last)finish();else{S.i++;render()}};
    acts.append(pv,$("span","spacer"),nx);
  }else if(!done){
    const ck=$("button","btn pri","Check answer");ck.type="button";ck.disabled=!S.ans[S.i].length;ck.onclick=()=>{S.checked[S.i]=true;render()};
    const sk=$("button","btn","Skip");sk.type="button";sk.onclick=()=>{S.ans[S.i]=[];S.checked[S.i]=true;render()};
    acts.append(ck,sk);
  }else{
    const nx=$("button","btn pri",last?"See results":"Next question");nx.type="button";nx.onclick=()=>{if(last)finish();else{S.i++;render()}};acts.append(nx);
  }
  qc.append(acts);app.append(qc);
  if(S.exam){const un=S.ans.filter(a=>!a.length).length;app.append($("p","muted small",un?un+" question"+(un>1?"s":"")+" not answered yet.":"All questions answered."))}
}
function finish(){
  clearInterval(timer);const n=S.qs.length;
  const res=S.qs.map((q,i)=>same(S.ans[i],q.a));const sc=res.filter(Boolean).length,pct=Math.round(sc/n*100);
  if(!S.retry&&(prefs.best[S.key]==null||pct>prefs.best[S.key])){prefs.best[S.key]=pct;store.set(prefs)}
  app.textContent="";
  const bar=$("div","bar");const back=$("button","link","← Home");back.type="button";back.onclick=home;bar.append(back,$("span","title",S.title));app.append(bar);
  const qc=$("div","qcard");const s=$("div","score");s.append($("span","n",sc+" / "+n),$("span","muted",pct+"% correct"+(S.exam?" · "+Math.round((Date.now()-S.t0)/60000)+" min":"")));
  qc.append($("div","eyebrow","Result"),s);
  const lecs=[...new Set(S.qs.map(q=>q.lec))];
  if(lecs.length>1){const rows=$("div","rows");lecs.sort().forEach(k=>{const idx=S.qs.map((q,i)=>q.lec===k?i:-1).filter(i=>i>=0),c=idx.filter(i=>res[i]).length;
    const r=$("div","row");const p=$("div","prog");p.style.setProperty("--c","var("+LEC[k].c+")");const pi=$("i");pi.style.width=(c/idx.length*100)+"%";p.append(pi);
    r.append($("span","",LEC[k].n+" · "+LEC[k].t),p,$("span","v",c+" / "+idx.length));rows.append(r)});qc.append(rows)}
  const acts=$("div","acts");const wrong=S.qs.filter((q,i)=>!res[i]);
  if(wrong.length){const rw=$("button","btn pri","Retry the "+wrong.length+" I got wrong");rw.type="button";rw.onclick=()=>start({key:S.key,title:S.title,color:S.color,qs:wrong,exam:false,retry:true});acts.append(rw)}
  const hm=$("button","btn","Back to home");hm.type="button";hm.onclick=home;acts.append(hm);qc.append(acts);app.append(qc);
  const g=$("div","group");g.append($("h2","",wrong.length?"Review":"Review · all correct"));
  S.qs.forEach((q,i)=>{if(res[i]&&!S.exam)return;
    const r=$("div","rev"+(res[i]?" ok":""));r.append($("div","q",(i+1)+". "+q.q));
    const fmt=a=>a.length?a.slice().sort().map(j=>letters[j]+") "+q.o[j]).join("  ·  "):"No answer";
    if(!res[i]){const y=$("div","y");y.append($("b","","Your answer: "),document.createTextNode(fmt(S.ans[i])));r.append(y)}
    const a=$("div","a");a.append($("b","","Correct: "),document.createTextNode(fmt(q.a)));r.append(a);
    if(q.e)r.append($("div","muted small",q.e));g.append(r)});
  app.append(g);window.scrollTo(0,0);
}
